<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<title>Silas Veyr — Compagnon de combat</title>
<style>html,body{margin:0;min-height:100%;background:#08100f;color:#f1eadc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 22% 25%,#6ec7a035,transparent 32rem),radial-gradient(circle at 82% 72%,#d7a94c2f,transparent 28rem),#08100f}.boot div{text-align:center}.sig{font-size:54px;color:#d7a94c;text-shadow:0 0 24px #6ec7a055}.boot p{color:#aaa99e}</style>
</head>
<body>
<div class="boot"><div><div class="sig">◇</div><h1>Silas Veyr</h1><p>Préparation de l’atelier alchimique…</p></div></div>
<script>
(async()=>{
 try{
  const base='https://raw.githubusercontent.com/bryantoualy-del/Silas/f331abcf932c65b2dbf275c04468aa889d7c772e/index.html';
  let html=await (await fetch(base,{cache:'no-store'})).text();
  html=html.replace('</body>','<script src="signature-icon.js?v=1"><\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div class="boot"><div><h1>Silas Veyr</h1><p>Impossible de charger le compagnon. Recharge la page.</p></div></div>'}
})();
</script>
</body>
</html>
